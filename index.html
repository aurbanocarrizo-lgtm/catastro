<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Buscador Catastral Euskadi</title>
    
    <!-- Fuente moderna -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; 
            margin: 0; 
            padding: 16px; 
            background-color: #f8fafc; 
            color: #1e293b; 
        }
        
        .container { 
            max-width: 1400px; 
            margin: 0 auto; 
            background: #ffffff; 
            padding: 24px; 
            border-radius: 16px; 
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01); 
            width: 100%; 
        }
        
        /* Cabecera y Logo */
        .header-top { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 2px solid #f1f5f9; 
            padding-bottom: 16px; 
            margin-bottom: 24px; 
        }
        .logo-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo-icon {
            background: #eff6ff;
            color: #2563eb;
            padding: 10px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        h1 { margin: 0; color: #0f172a; font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
        
        /* Botones */
        .btn { 
            padding: 10px 20px; 
            font-size: 14px; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: 600; 
            transition: all 0.2s ease; 
            color: white; 
            display: inline-flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 44px; 
            width: 100%; 
            font-family: 'Inter', sans-serif;
        }
        .btn-blue { 
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); 
            box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2);
        } 
        .btn-blue:hover { 
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); 
            transform: translateY(-1px);
            box-shadow: 0 6px 8px -1px rgba(37, 99, 235, 0.3);
        }
        
        /* Paneles */
        #status-panel { background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 10px; padding: 16px; margin-bottom: 20px; }
        .status-header { display: flex; align-items: center; justify-content: space-between; font-weight: 600; font-size: 14px; color: #1e3a8a; }
        .spinner { width: 18px; height: 18px; border: 3px solid #93c5fd; border-top: 3px solid #1d4ed8; border-radius: 50%; animation: spin 0.8s linear infinite; display: inline-block; margin-right: 10px; vertical-align: middle; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .error-box { margin-top: 10px; padding: 12px; background: #fef2f2; border: 1px solid #fecaca; border-radius: 8px; color: #991b1b; font-family: monospace; font-size: 12px; white-space: pre-wrap; word-break: break-all; }

        .controls-panel { margin-bottom: 24px; width: 100%; }
        .search-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); 
            gap: 16px; 
            margin-bottom: 20px; 
            background: #f8fafc; 
            padding: 20px; 
            border-radius: 12px; 
            border: 1px solid #e2e8f0; 
            width: 100%; 
        }
        
        /* Formularios */
        .form-group { display: flex; flex-direction: column; min-width: 0; }
        .form-group label { font-size: 12px; font-weight: 600; color: #475569; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        .form-group input, .form-group select { 
            width: 100%; max-width: 100%; padding: 12px 14px; font-size: 15px; 
            border: 1px solid #cbd5e1; border-radius: 8px; outline: none; 
            background-color: #ffffff; -webkit-appearance: none;
            text-overflow: ellipsis; overflow: hidden; white-space: nowrap;
            transition: border-color 0.2s;
            font-family: 'Inter', sans-serif;
        }
        .form-group input:focus, .form-group select:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); }
        
        /* Checkboxes */
        .column-selector { border-top: 1px solid #e2e8f0; padding-top: 16px; }
        .column-selector h3 { font-size: 13px; color: #475569; margin: 0 0 12px 0; }
        .checkbox-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
        .checkbox-item { display: flex; align-items: center; font-size: 13px; color: #334155; padding: 4px 0; font-weight: 500;}
        .checkbox-item input { width: 16px; height: 16px; margin-right: 8px; cursor: pointer; accent-color: #2563eb; }

        .mobile-scroll-hint { display: none; font-size: 12px; color: #3b82f6; font-weight: 600; text-align: right; margin-bottom: 8px; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        /* Tabla y Efecto Cristal */
        .table-container { 
            overflow-x: auto; 
            border: 1px solid #e2e8f0; 
            border-radius: 12px; 
            max-height: 550px; 
            -webkit-overflow-scrolling: touch; 
            width: 100%; 
            display: block; 
            box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.02);
        }
        .table-container::-webkit-scrollbar { height: 10px; width: 10px;}
        .table-container::-webkit-scrollbar-track { background: #f8fafc; border-radius: 0 0 12px 12px; }
        .table-container::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 12px; border: 2px solid #f8fafc; }
        .table-container::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px; white-space: nowrap; }
        
        th { 
            background: rgba(248, 250, 252, 0.85); 
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: #334155; 
            font-weight: 600; 
            padding: 14px 16px; 
            border-bottom: 2px solid #e2e8f0; 
            cursor: pointer; 
            position: sticky; 
            top: 0; 
            z-index: 10; 
            user-select: none; 
            letter-spacing: 0.3px;
        }
        th:hover { background: rgba(226, 232, 240, 0.95); }
        td { padding: 12px 16px; border-bottom: 1px solid #f1f5f9; color: #475569; }
        tr:nth-child(even) { background-color: #f8fafc; }
        tr:hover td { background-color: #eff6ff; color: #1e3a8a;}
        
        /* Etiquetas y Copiar */
        .badge { background: #e0f2fe; color: #0284c7; padding: 4px 8px; border-radius: 6px; font-weight: 600; font-family: monospace; font-size: 12px; border: 1px solid #bae6fd;}
        .btn-copy { background: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600; transition: all 0.2s; font-family: 'Inter', sans-serif;}
        .btn-copy:hover { background: #10b981; color: white; border-color: #10b981; }
        .footer-info { margin-top: 16px; font-size: 13px; color: #64748b; font-weight: 500; display: flex; justify-content: space-between;}

        /* Estado Vacío de la tabla al inicio */
        .empty-state { text-align: center; padding: 50px 20px; color: #64748b; }
        .empty-icon { font-size: 40px; margin-bottom: 12px; filter: grayscale(20%); opacity: 0.8;}

        @media (max-width: 768px) {
            body { padding: 8px; background-color: #ffffff; }
            .container { padding: 12px; border-radius: 12px; box-shadow: none; border: 1px solid #e2e8f0; }
            h1 { font-size: 18px; }
            .search-grid { grid-template-columns: 1fr; padding: 16px; gap: 12px; }
            .checkbox-grid { grid-template-columns: 1fr 1fr; }
            td, th { padding: 12px 10px; font-size: 13px; }
            .btn-copy { padding: 8px 10px; }
            .mobile-scroll-hint { display: block; }
        }
    </style>
</head>
